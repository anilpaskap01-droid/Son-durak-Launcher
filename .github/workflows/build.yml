# Builds the launcher (release/) and the installer (dist/SonDurak-Setup.exe) from this repository.
# The read-only GitHub token the installer needs comes from the SONDURAK_READ_TOKEN secret
# (build.mjs checks it can read the game repos and cannot write to them, and keeps it out of the exe).
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['release/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build launcher and setup
        env:
          SONDURAK_READ_TOKEN: ${{ secrets.SONDURAK_READ_TOKEN }}
        run: node build.mjs

      - name: Upload unsigned build
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: SonDurak-unsigned
          path: |
            release/
            dist/SonDurak-Setup.exe
          if-no-files-found: error

      # Code signing through SignPath Foundation. Skipped until the SignPath project exists:
      # it runs once the repo variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set.
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'son-durak' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed build
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SonDurak-signed
          path: signed/
          if-no-files-found: error
