<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Son Durak Launcher</title>
<style>
  :root {
    --bg: #0e141b; --panel: #151e29; --card: #1b2838; --line: rgba(255,255,255,.06);
    --text: #dfe3e6; --soft: #b8c2cc; --muted: #8f98a0; --blue: #67c1f5; --amber: #ffb020;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  .app { height: 100%; display: flex; flex-direction: column; }

  /* title bar */
  .titlebar { height: 34px; flex: none; display: flex; align-items: center; padding-left: 14px; background: #0a0f15; border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
  .brand { flex: 1; display: flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: .22em; color: var(--muted); }
  .brand i { width: 9px; height: 9px; border-radius: 2px; background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .titlebar button { height: 34px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font: 13px "Segoe UI", sans-serif; }
  .titlebar button:hover { background: rgba(255,255,255,.07); color: #fff; }
  .titlebar .win { width: 44px; font-size: 15px; }
  .titlebar .x:hover { background: #c42b1c; }
  .langs { display: flex; margin-right: 6px; }
  .langs button { width: 38px; font-weight: 700; font-size: 11px; letter-spacing: .08em; }
  .langs button.sel { color: var(--blue); box-shadow: inset 0 -2px 0 var(--blue); }

  /* hero art */
  .hero { position: relative; height: 300px; flex: none; background: url("{{BG}}") center 42% / cover no-repeat; }
  .hero::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(14,20,27,0) 35%, rgba(14,20,27,.7) 75%, var(--bg) 100%),
                linear-gradient(90deg, rgba(14,20,27,.88) 0%, rgba(14,20,27,.35) 45%, rgba(14,20,27,0) 70%); }
  .hero .txt { position: absolute; left: 40px; bottom: 44px; z-index: 2; }
  .logo { margin: 0; font-family: Consolas, "Courier New", monospace; font-weight: 800; font-size: 56px; letter-spacing: .2em; color: var(--amber); text-shadow: 0 0 26px rgba(255,176,32,.5); }
  .sub { margin: 2px 0 12px; color: #c9d1d8; letter-spacing: .06em; }
  .tags span { display: inline-block; font-size: 11px; padding: 3px 9px; margin-right: 6px; border-radius: 3px; background: rgba(103,193,245,.16); color: var(--blue); }

  /* action bar (play / update + stats) */
  .actionbar { flex: none; position: relative; z-index: 3; margin: -26px 24px 0; display: flex; align-items: center; gap: 22px; padding: 14px 18px;
    background: linear-gradient(90deg, rgba(24,33,46,.97), rgba(28,41,58,.97)); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 12px 34px rgba(0,0,0,.5); }
  .main-btn { flex: none; min-width: 200px; height: 52px; padding: 0 26px; border: 0; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 12px;
    font: 700 19px "Segoe UI", sans-serif; letter-spacing: .08em; color: #fff; cursor: pointer; transition: filter .15s, transform .08s; }
  .main-btn svg { width: 20px; height: 20px; fill: currentColor; }
  .main-btn.play { background: linear-gradient(90deg, #6fb522, #4f9c19); box-shadow: 0 6px 18px rgba(111,181,34,.25); }
  .main-btn.dl { background: linear-gradient(90deg, #1a9fff, #1f6ad8); box-shadow: 0 6px 18px rgba(26,159,255,.25); }
  .main-btn:hover:not(:disabled) { filter: brightness(1.1); }
  .main-btn:active:not(:disabled) { transform: translateY(1px); }
  .main-btn:disabled { filter: grayscale(.75) brightness(.6); cursor: default; box-shadow: none; }
  .astatus { flex: 1; min-width: 0; }
  .astatus .st { font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .astatus .st b { color: #fff; }
  .astatus .sm { margin-top: 3px; font-size: 12px; color: var(--muted); min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .astatus .sm .link { margin-left: 10px; }
  .progress { height: 6px; margin-top: 8px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; display: none; }
  .progress.show { display: block; }
  .fill { height: 100%; width: 0; background: linear-gradient(90deg, #1a9fff, #67c1f5); transition: width .2s; }
  .err { margin-top: 4px; font-size: 12px; color: #ff8a80; }
  .stats { flex: none; display: flex; gap: 24px; padding-left: 18px; border-left: 1px solid var(--line); }
  .stat label { display: block; font-size: 10px; letter-spacing: .14em; color: var(--muted); margin-bottom: 3px; }
  .stat b { font-size: 14px; font-weight: 600; color: var(--text); }
  .tools { flex: none; display: flex; gap: 6px; }
  .tool { width: 36px; height: 36px; border: 0; border-radius: 4px; background: rgba(255,255,255,.06); color: #c7d5e0; cursor: pointer; display: grid; place-items: center; }
  .tool:hover { background: rgba(255,255,255,.13); color: #fff; }
  .tool svg { width: 17px; height: 17px; fill: currentColor; }
  .spin { display: inline-block; width: 12px; height: 12px; margin-right: 7px; vertical-align: -1px; border: 2px solid rgba(255,255,255,.25); border-top-color: var(--blue); border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .link { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; font: inherit; }
  .link:hover { text-decoration: underline; }

  /* content: patch notes + side boxes */
  .content { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 300px; gap: 20px; padding: 20px 24px 16px; }
  h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .16em; color: var(--muted); }
  .news { min-height: 0; display: flex; flex-direction: column; }
  .list { flex: 1; min-height: 0; overflow: auto; padding-right: 6px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border-radius: 5px; padding: 12px 15px; border-left: 3px solid transparent; }
  .card.new { border-left-color: var(--blue); }
  .card .hd { display: flex; align-items: center; gap: 10px; }
  .ver { font-family: Consolas, monospace; font-size: 12px; color: var(--blue); background: rgba(103,193,245,.12); padding: 1px 7px; border-radius: 3px; }
  .ttl { font-size: 15px; font-weight: 600; color: #fff; }
  .badge { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: #0e141b; background: var(--blue); padding: 2px 6px; border-radius: 3px; }
  .date { margin-left: auto; font-size: 12px; color: var(--muted); }
  .card ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.55; color: var(--soft); }
  .empty { color: var(--muted); font-size: 13px; }
  aside { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
  .box { background: var(--panel); border-radius: 5px; padding: 12px 14px; }
  .box p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--soft); }
  .facts { list-style: none; margin: 10px 0 0; padding: 0; }
  .facts li { font-size: 13px; padding: 5px 0; border-top: 1px solid var(--line); color: #c7d5e0; }
  .facts li::before { content: '▸'; color: var(--blue); margin-right: 8px; }
  .lver { margin-top: auto; font-size: 11px; color: #56616c; }
  .lver .badge { margin-left: 6px; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; } ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar" id="bar">
    <div class="brand"><i></i>SON DURAK</div>
    <div class="langs" id="langs"><button data-l="tr">TR</button><button data-l="en">EN</button></div>
    <button class="win" id="min" title="—">&#8211;</button><button class="win x" id="close" title="×">&#10005;</button>
  </div>

  <header class="hero">
    <div class="txt">
      <h1 class="logo">SON DURAK</h1>
      <p class="sub" id="sub"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <div class="actionbar">
    <button class="main-btn play" id="main" disabled></button>
    <div class="astatus">
      <div class="st" id="status"></div>
      <div class="sm" id="small"></div>
      <div class="progress" id="progress"><div class="fill" id="fill"></div></div>
      <div class="err" id="err"></div>
    </div>
    <div class="stats">
      <div class="stat"><label id="lVer"></label><b id="sVer">—</b></div>
      <div class="stat"><label id="lTime"></label><b id="sTime">—</b></div>
      <div class="stat"><label id="lLast"></label><b id="sLast">—</b></div>
    </div>
    <div class="tools">
      <button class="tool" id="recheck"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 1 7.4 5H17v2h6V5h-2v2.3A10 10 0 1 0 22 12h-2a8 8 0 1 1-8-8z"/></svg></button>
      <button class="tool" id="folder"><svg viewBox="0 0 24 24"><path d="M3 5h7l2 2h9v12H3z"/></svg></button>
    </div>
  </div>

  <div class="content">
    <section class="news">
      <h2 id="hNews"></h2>
      <div class="list" id="news"></div>
    </section>
    <aside>
      <div class="box"><h2 id="hAbout"></h2><p id="about"></p><ul class="facts" id="facts"></ul></div>
      <div class="box"><h2 id="hMp"></h2><p id="mp"></p></div>
      <div class="lver" id="lver"></div>
    </aside>
  </div>
</div>
<script>
  const STR = {
    tr: {
      sub: 'T9 Gece Hattı · Anomali Avı', tags: ['Korku', 'Bulmaca', 'Co-op'],
      play: 'OYNA', install: 'YÜKLE', update: 'GÜNCELLE', busy: 'İNDİRİLİYOR', selfBtn: 'GÜNCELLENİYOR',
      checking: 'Güncellemeler denetleniyor…', ready: 'Oyun güncel', updateReady: 'Güncelleme hazır', notInstalled: 'Oyun henüz yüklü değil',
      offline: 'Çevrimdışı — yüklü sürümle oynayabilirsin', offlineNoGame: 'İnternet bağlantısı yok. Oyunu indirmek için bağlantı gerekli.',
      selfUpdate: 'Launcher güncelleniyor…', downloading: 'İndiriliyor…', playAnyway: 'Güncellemeden oyna', files: 'dosya',
      lVer: 'SÜRÜM', lTime: 'OYNAMA SÜRESİ', lLast: 'SON OYNAMA', never: 'Hiç', today: 'Bugün', yesterday: 'Dün', hours: 'saat', minutes: 'dk',
      hNews: 'YENİLİKLER', hAbout: 'OYUN HAKKINDA', hMp: 'ARKADAŞLARINLA OYNA', fresh: 'YENİ', noNews: 'Yenilikler internete bağlanınca görünecek.',
      recheck: 'Güncellemeleri denetle', folder: 'Oyun klasörü', launcherUpdated: 'güncellendi',
      errors: { 'repo-not-found': 'Güncelleme sunucusuna ulaşılamadı.', 'auth': 'Güncelleme sunucusuna bağlanılamadı. Launcher\'ın en yeni sürümünü kur.', 'rate-limit': 'Sunucu şu an meşgul, biraz sonra tekrar dene.', 'launcher-update': 'Launcher güncellenemedi, bu sürümle devam ediliyor.', other: 'Güncelleme alınamadı, biraz sonra tekrar dene.' },
    },
    en: {
      sub: 'T9 Night Line · Anomaly Hunt', tags: ['Horror', 'Puzzle', 'Co-op'],
      play: 'PLAY', install: 'INSTALL', update: 'UPDATE', busy: 'DOWNLOADING', selfBtn: 'UPDATING',
      checking: 'Checking for updates…', ready: 'Up to date', updateReady: 'Update ready', notInstalled: 'The game is not installed yet',
      offline: 'Offline — you can play the installed version', offlineNoGame: 'No internet. A connection is needed to download the game.',
      selfUpdate: 'Updating the launcher…', downloading: 'Downloading…', playAnyway: 'Play without updating', files: 'files',
      lVer: 'VERSION', lTime: 'PLAY TIME', lLast: 'LAST PLAYED', never: 'Never', today: 'Today', yesterday: 'Yesterday', hours: 'hrs', minutes: 'min',
      hNews: "WHAT'S NEW", hAbout: 'ABOUT', hMp: 'PLAY WITH FRIENDS', fresh: 'NEW', noNews: 'News will appear once you are online.',
      recheck: 'Check for updates', folder: 'Game folder', launcherUpdated: 'updated',
      errors: { 'repo-not-found': 'Could not reach the update server.', 'auth': 'Could not connect to the update server. Please install the latest launcher.', 'rate-limit': 'The server is busy, try again in a bit.', 'launcher-update': 'The launcher could not update itself; continuing with this version.', other: 'Could not get the update, try again in a bit.' },
    },
  };
  let lang = (navigator.language || 'tr').toLowerCase().startsWith('tr') ? 'tr' : 'en', L = STR[lang], last = null, action = null;
  const $ = (id) => document.getElementById(id);
  const send = (cmd, extra) => window.chrome.webview.postMessage({ cmd, ...extra });
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mb = (b) => (b / 1048576).toFixed(1).replace('.', lang === 'tr' ? ',' : '.') + ' MB';
  // The design is 1120 x 680 CSS px; scale it to the real window (DPI, small screens).
  const fit = () => { const k = Math.min(innerWidth / 1120, innerHeight / 680); document.documentElement.style.zoom = Math.abs(k - 1) < 0.01 ? '' : String(k); };
  addEventListener('resize', fit); fit();

  const ICON = {
    play: '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
    dl: '<svg viewBox="0 0 24 24"><path d="M11 3h2v10l4-4 1.4 1.4L12 16.8 5.6 10.4 7 9l4 4zM4 19h16v2H4z"/></svg>',
  };
  function cmpVer(a, b) { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); } return 0; }
  function fmtDate(d) { if (!d) return ''; const t = new Date(d); return isNaN(t) ? d : t.toLocaleDateString(lang === 'tr' ? 'tr-TR' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); }
  function fmtTime(sec) {
    if (!sec) return '0 ' + L.minutes;
    if (sec < 3600) return Math.max(1, Math.round(sec / 60)) + ' ' + L.minutes;
    return (sec / 3600).toFixed(1).replace('.', lang === 'tr' ? ',' : '.') + ' ' + L.hours;
  }
  function fmtLast(iso) {
    if (!iso) return L.never;
    const d = new Date(iso), now = new Date(), day = 86400000;
    const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((startOf(now) - startOf(d)) / day);
    return diff <= 0 ? L.today : diff === 1 ? L.yesterday : d.toLocaleDateString(lang === 'tr' ? 'tr-TR' : 'en-GB', { day: 'numeric', month: 'short' });
  }

  function applyStatic() {
    document.documentElement.lang = lang;
    $('sub').textContent = L.sub;
    $('tags').innerHTML = L.tags.map((t) => `<span>${esc(t)}</span>`).join('');
    for (const k of ['lVer', 'lTime', 'lLast', 'hNews', 'hAbout', 'hMp']) $(k).textContent = L[k];
    $('recheck').title = L.recheck; $('folder').title = L.folder;
    for (const b of $('langs').children) b.classList.toggle('sel', b.dataset.l === lang);
  }
  function setLang(l) { if (!STR[l]) return; lang = l; L = STR[l]; applyStatic(); if (last) render(last); }

  function setButton(kind, text, act, disabled = false) {
    const b = $('main');
    b.className = 'main-btn ' + (kind === 'play' ? 'play' : 'dl');
    b.innerHTML = (kind === 'play' ? ICON.play : ICON.dl) + `<span>${esc(text)}</span>`;
    b.disabled = disabled; action = act;
  }

  function render(s) {
    last = s;
    const v = (x) => x ? 'v' + x : '—';
    let status = '', small = '';
    $('progress').classList.toggle('show', s.status === 'busy' || s.status === 'selfUpdate');
    switch (s.status) {
      case 'checking': status = `<span class="spin"></span>${L.checking}`; setButton('play', s.installed ? L.play : L.install, s.installed ? 'play' : null, !s.installed); break;
      case 'selfUpdate': status = `<span class="spin"></span>${L.selfUpdate}`; setButton('dl', L.selfBtn, null, true); break;
      case 'busy': status = `<span class="spin"></span>${L.downloading}`; setButton('dl', L.busy, null, true); break;
      case 'notInstalled': status = `<b>${L.notInstalled}</b>`; small = s.plan ? `${v(s.latestVersion)} · ${mb(s.plan.bytes)}` : v(s.latestVersion); setButton('dl', L.install, 'install'); break;
      case 'offlineNoGame': status = L.offlineNoGame; setButton('dl', L.install, null, true); break;
      case 'update':
        status = `<b>${L.updateReady}</b>`;
        small = (s.installedVersion && s.latestVersion && s.installedVersion !== s.latestVersion ? `${v(s.installedVersion)} → ${v(s.latestVersion)}` : v(s.latestVersion))
          + (s.plan ? ` · ${s.plan.files} ${L.files} · ${mb(s.plan.bytes)}` : '') + `<button class="link" id="anyway">${L.playAnyway}</button>`;
        setButton('dl', L.update, 'update'); break;
      default: status = s.offline ? L.offline : `<b>${L.ready}</b>`; small = v(s.installedVersion); setButton('play', L.play, 'play');
    }
    $('status').innerHTML = status;
    $('small').innerHTML = small;
    const anyway = $('anyway'); if (anyway) anyway.onclick = () => send('play');
    $('err').textContent = s.error ? (L.errors[s.error] || L.errors.other) : '';

    $('sVer').textContent = v(s.installedVersion || (s.installed ? null : s.latestVersion));
    $('sTime').textContent = fmtTime(s.playSeconds);
    $('sLast').textContent = fmtLast(s.lastPlayed);

    const news = s.news || {}, notes = news.notes || [], game = (news.game || {})[lang] || {};
    $('news').innerHTML = notes.length ? notes.map((n) => {
      const t = n[lang] || n.tr || {}, fresh = s.installedVersion && cmpVer(n.version, s.installedVersion) > 0;
      return `<div class="card ${fresh ? 'new' : ''}"><div class="hd"><span class="ver">v${esc(n.version)}</span><span class="ttl">${esc(t.title)}</span>${fresh ? `<span class="badge">${L.fresh}</span>` : ''}<span class="date">${esc(fmtDate(n.date))}</span></div>`
        + `<ul>${(t.items || []).map((i) => `<li>${esc(i)}</li>`).join('')}</ul></div>`;
    }).join('') : `<div class="empty">${L.noNews}</div>`;
    $('about').textContent = game.about || '';
    $('facts').innerHTML = (game.facts || []).map((f) => `<li>${esc(f)}</li>`).join('');
    $('mp').textContent = game.multiplayer || '';
    $('lver').innerHTML = `Launcher ${esc(s.version || '')}${s.launcherUpdated ? `<span class="badge">${L.launcherUpdated}</span>` : ''}`;
  }

  function progress(p) {
    const k = p.total ? p.done / p.total : (p.filesTotal ? p.files / p.filesTotal : 1);
    $('fill').style.width = (k * 100).toFixed(1) + '%';
    $('small').textContent = `${mb(p.done)} / ${mb(p.total)} · ${p.files}/${p.filesTotal} ${L.files}`;
  }

  applyStatic();
  for (const b of $('langs').children) b.onclick = () => { setLang(b.dataset.l); send('lang', { lang: b.dataset.l }); };
  $('bar').addEventListener('mousedown', (e) => { if (e.target.id === 'bar' || e.target.closest('.brand')) send('drag'); });
  $('min').onclick = () => send('min'); $('close').onclick = () => send('close');
  $('recheck').onclick = () => send('check'); $('folder').onclick = () => send('folder');
  $('main').onclick = () => action && send(action);
  window.chrome.webview.addEventListener('message', (e) => {
    const m = e.data;
    if (m.type === 'state') { if (m.lang && m.lang !== lang && STR[m.lang]) { lang = m.lang; L = STR[lang]; applyStatic(); } render(m); }
    else if (m.type === 'progress') progress(m);
  });
  send('ready');
</script>
</body>
</html>
